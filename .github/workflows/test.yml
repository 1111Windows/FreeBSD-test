
name: Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    name: A job to run test in FreeBSD
    steps:
    - uses: actions/checkout@v4
    - name: Start VM
      id: vm
      uses: vmactions/freebsd-vm@v1.3.4
      with:
        sync: zfs
    - name: Custom shell step 1
      shell: freebsd {0}
      run: |
        cd $GITHUB_WORKSPACE;
        pwd
    - name: Custom shell step 2
      run: |
        cd $GITHUB_WORKSPACE;
        sudo apt install tar -y
        mkdir out
        pwd
        ls
        touch ./out/test/e
        mkdir upload
        tar-czvf ./upload/free-.tar.gz out/

    - name: Upload tar archives
      uses: actions/upload-artifact@v4
      with:
          name: "-amd64-e-tgz"
          path: /upload/*.tar.gz
          if-no-files-found: ignore
