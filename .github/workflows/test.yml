
name: Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    name: A job to run test in FreeBSD
    steps:
    - uses: actions/checkout@v4
    - name: Start VM
      id: vm
      uses: vmactions/freebsd-vm@v1.3.4
      with:
        sync: zfs
    - name: Custom shell step 1
      shell: freebsd {0}
      run: |
        cd $GITHUB_WORKSPACE;
        pwd
        echo "this is step 1, running inside the VM"
    - name: Custom shell step 2

      run: |
        cd $GITHUB_WORKSPACE;
        sudo apt install tar -y
        mkdir out
        pwd
        ls
        touch ./out/test/
        tar -czvf out
